[project]
name = "daily-overlay"
version = "0.1.0"
description = "Context-aware ambient desktop overlay directed daily by Gemini 3.8 Flash"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "psutil>=6.0.0",
    "pydantic>=2.7.0",
    "pyside6>=6.7.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
daily-overlay = "daily_overlay.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_overlay"]
